name: CI - Lint & Bruno API Testing

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    name: Lint & Bruno API Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_jwt_secret_portfolio_cms_123456789' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci_test_jwt_refresh_secret_portfolio_cms_123456789' }}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema (if DB URL provided)
        if: env.DATABASE_URL != ''
        run: npx prisma db push --skip-generate

      # ============================================================
      # 1. Code Quality & Linting
      # Jika linting error, pipeline langsung GAGAL
      # ============================================================
      - name: Run ESLint
        run: npm run lint

      # ============================================================
      # 2. Start Local Backend Server
      # Menjalankan backend di background untuk pengujian API
      # ============================================================
      - name: Start Local Backend Server
        run: |
          node server.js &
          echo "Waiting for backend server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/health | grep -q "ok"; then
              echo "Backend server is up and healthy!"
              break
            fi
            echo "Waiting for server ($i/30)..."
            sleep 1
          done

      # ============================================================
      # 3. Install Bruno CLI & Run API Integration Tests
      # Menjalankan pengujian API langsung terhadap localhost:3000/api
      # ============================================================
      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno API Integration Tests
        working-directory: ./bruno
        run: |
          mkdir -p ../bruno-reports
          bru run . \
            --env local \
            -r \
            --reporter-html ../bruno-reports/bruno-api-report.html

      # ============================================================
      # 4. Upload Bruno HTML Report Artifact
      # ============================================================
      - name: Upload Bruno Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bruno-api-test-report
          path: bruno-reports/
          retention-days: 30
